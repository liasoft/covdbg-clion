# Plugin coordinates and the CLion builds it supports.
# Keep pluginVersion in step with the covdbg CLI release it supports.
pluginVersion = 1.3.0

# Compile against the OLDEST supported platform, so an API added later cannot be used by accident.
# The supported range is pluginSinceBuild..pluginUntilBuild, and the plugin verifier checks both ends.
platformVersion = 2025.3.3
pluginSinceBuild = 253
pluginUntilBuild = 262.*

# The newest supported platform. Only used for verification.
verifyAgainstVersion = 2026.2

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=false
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=false
