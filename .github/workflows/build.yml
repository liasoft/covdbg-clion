name: Build

on:
  push:
    # The git flow branches (see .gitflow). Feature and bugfix branches build through their pull requests.
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion needs the full history and tags.
          fetch-depth: 0

      - uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.x"

      - id: gitversion
        uses: gittools/actions/gitversion/execute@v4

  build:
    name: Build and test
    needs: version
    # The plugin is Windows-only and the tests use Windows paths.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build plugin ${{ needs.version.outputs.semVer }}
        run: ./gradlew.bat test buildPlugin "-PpluginVersion=${{ needs.version.outputs.semVer }}"

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: covdbg-clion-${{ needs.version.outputs.semVer }}
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests

  verify:
    name: Verify plugin
    # The verifier is static bytecode analysis, so it does not need Windows; Linux runners handle the
    # two CLion downloads (both ends of the supported range) faster.
    runs-on: ubuntu-latest
    steps:
      # The runner has only ~14 GB free, less than the verifier needs: each CLion it checks against
      # is kept both as the downloaded archive and extracted. Drop preinstalled toolchains this job
      # never uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia*
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Fails on any internal API usage, which the Marketplace rejects.
      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - name: Upload verifier reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier

  # Publishes to the JetBrains Marketplace when a GitHub release is published. Its tag (v1.0.0, or
  # v1.1.0-beta.1 for the beta channel) sets the version.
  #
  # Needs a "marketplace" environment in the repository settings with the secrets PUBLISH_TOKEN
  # (Marketplace permanent token) and CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD (plugin
  # signing, see https://plugins.jetbrains.com/docs/intellij/plugin-signing.html).
  #
  # The Marketplace accepts only updates from here: the plugin's first version has to be uploaded by
  # hand at https://plugins.jetbrains.com/plugin/add, so this job cannot publish it. The signed zip
  # is uploaded as the run's covdbg-clion-<version>-signed artifact before publishing, so it is there
  # for that manual upload even when publishing fails.
  publish:
    name: Publish to Marketplace
    needs: [version, build, verify]
    if: github.event_name == 'release'
    runs-on: windows-latest
    environment: marketplace
    env:
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Sign plugin ${{ needs.version.outputs.semVer }}
        run: ./gradlew.bat signPlugin "-PpluginVersion=${{ needs.version.outputs.semVer }}"

      - name: Upload signed plugin
        uses: actions/upload-artifact@v7
        with:
          name: covdbg-clion-${{ needs.version.outputs.semVer }}-signed
          path: build/distributions/*-signed.zip
          if-no-files-found: error

      # Publishes the signed zip built above; Gradle finds signPlugin up to date.
      - name: Publish plugin
        run: ./gradlew.bat publishPlugin "-PpluginVersion=${{ needs.version.outputs.semVer }}"
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
