# The plugin version is derived from git history by GitVersion (https://gitversion.net), following
# the git flow branches set up in .gitflow:
#   main       - the release tag, e.g. 1.0.0 for tag v1.0.0
#   develop    - the next minor as an alpha, e.g. 1.1.0-alpha.3
#   release/*  - the release branch's version as a beta, e.g. 1.1.0-beta.1 on release/v1.1.0
#   hotfix/*   - the next patch as a beta
#   feature/*  - the feature name as the label
#
# Plugin versions are independent of covdbg's. The covdbg release a plugin version requires is
# stated in the README's Requirements and in the change notes.
workflow: GitFlow/v1

# No release has been tagged yet; the first is 1.0.0.
next-version: 1.0.0
