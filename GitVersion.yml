# The plugin version is derived from git history by GitVersion (https://gitversion.net), following
# the git flow branches set up in .gitflow:
#   main       - the release tag, e.g. 1.3.0 for tag v1.3.0
#   develop    - the next minor as an alpha, e.g. 1.4.0-alpha.3
#   release/*  - the release branch's version as a beta, e.g. 1.4.0-beta.1 on release/1.4.0
#   hotfix/*   - the next patch as a beta
#   feature/*  - the feature name as the label
#
# Plugin releases track the covdbg CLI release they support, so name release and hotfix branches
# after that covdbg version.
workflow: GitFlow/v1

# No release has been tagged yet; the first one supports covdbg 1.3.0.
next-version: 1.0.0
